[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#060B18"
secondaryBackgroundColor = "#0E1626"
textColor = "#E6EDF7"
font = "sans serif"

[server]
headless = false
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
