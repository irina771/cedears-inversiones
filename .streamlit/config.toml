[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#111117"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = false
runOnSave = true
fileWatcherType = "auto"
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
